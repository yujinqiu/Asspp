name: Release Mac App
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: StoreEngine/go.mod
          cache-dependency-path: StoreEngine/go.sum
      - name: Test Store engine
        working-directory: StoreEngine
        run: go test -race ./...
      - name: Test download protocol
        run: bash Resources/Scripts/check.downloads.sh
      - name: Install build formatter
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify
      - name: Build macOS package
        run: bash Resources/Scripts/compile.release.osx.sh "$PWD" "$RUNNER_TEMP/Asspp-macos-arm64.zip"
      - name: Check release privacy
        run: python3 Resources/Scripts/check.release.privacy.py "$RUNNER_TEMP/Asspp-macos-arm64.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version - " 'index($0, heading) == 1 { copying = 1; next } copying && /^## / { exit } copying { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Asspp-macos-arm64.zip" --verify-tag --title "Asspp $GITHUB_REF_NAME (macOS)" --notes-file "$RUNNER_TEMP/release-notes.md"
